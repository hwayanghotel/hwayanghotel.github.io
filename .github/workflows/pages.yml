name: Build and publish GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pages: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run build
      - name: Publish static files to gh-pages
        shell: bash
        run: |
          set -euo pipefail
          test -f dist/index.html
          test -f dist/.nojekyll
          git fetch origin gh-pages
          pages_dir="$RUNNER_TEMP/neungundae-pages"
          git worktree add --detach "$pages_dir" origin/gh-pages
          rsync -a --delete --exclude=.git dist/ "$pages_dir/"
          git -C "$pages_dir" config user.name 'github-actions[bot]'
          git -C "$pages_dir" config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git -C "$pages_dir" add --all
          if ! git -C "$pages_dir" diff --cached --quiet; then
            git -C "$pages_dir" commit -m "Deploy $GITHUB_SHA"
            git -C "$pages_dir" push origin HEAD:gh-pages
          fi
      - name: Request GitHub Pages build
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          curl --fail-with-body --silent --show-error \
            --request POST \
            --header "Authorization: Bearer $GITHUB_TOKEN" \
            --header 'Accept: application/vnd.github+json' \
            --header 'X-GitHub-Api-Version: 2022-11-28' \
            "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/pages/builds"
